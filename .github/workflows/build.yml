name: Build Yumi

# 个人自用仓库：只在需要时手动构建一个模块 zip，不自动发布、不跑 lint/审计。
# 日常构建用本机的 scripts/build-local.sh；这个工作流只是备用构建机。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Module Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Install prebuilt bpf-linker
        shell: bash
        env:
          BPF_LINKER_VERSION: "0.11.1"
          BPF_LINKER_SHA256: e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          install_dir="$RUNNER_TEMP/bpf-linker-bin"
          curl --fail --location --retry 3 \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst" \
            --output "$archive"
          echo "$BPF_LINKER_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --zstd -xf "$archive" -C "$install_dir"
          "$install_dir/bpf-linker" --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Setup cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk

      - name: Run xtask build
        run: cargo xtask build

      - name: Upload module zip
        uses: actions/upload-artifact@v7
        with:
          name: yumi-module-zip
          path: output/*.zip
          if-no-files-found: error
